<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" role="img" aria-labelledby="gn-mark-title">
  <title id="gn-mark-title">G-Nesting</title>
  <!-- Chapa -->
  <rect x="2" y="2" width="44" height="44" rx="2" fill="none" stroke="#1F1E1C" stroke-width="2"/>
  <!-- "G" desenhado como percurso de ferramenta (toolpath) -->
  <path d="M35 13 H13 V35 H35 V24 H25" fill="none" stroke="#1F1E1C" stroke-width="5" stroke-linecap="square" stroke-linejoin="miter"/>
  <!-- Ponto de entrada da fresa -->
  <circle cx="35" cy="13" r="3" fill="#C4532D"/>
</svg>
