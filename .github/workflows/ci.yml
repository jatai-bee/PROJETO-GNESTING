# Verificação automática a cada push e pull request (docs/16-seguranca-e-testes.md).
# Mesmos passos de `composer check`, em MySQL 8.4 e em MySQL 5.7 (ainda comum em hospedagem compartilhada).
# Em push na main, com tudo verde, monta também o pacote de produção (.zip para enviar à hospedagem):
# aba Actions → execução → Artifacts (docs/17 §2). Assim ninguém precisa de PHP no computador.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: check (MySQL ${{ matrix.mysql }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        mysql: ["8.4", "5.7"]

    services:
      mysql:
        image: mysql:${{ matrix.mysql }}
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=5s --health-timeout=5s --health-retries=20

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo_mysql, mbstring, fileinfo, gd, zip
          coverage: none

      - name: Dependências
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Ambiente de teste
        run: |
          cp .env.example .env
          php bin/generate-key.php

      - name: Sintaxe (php -l)
        run: composer lint

      - name: Análise estática (PHPStan)
        run: composer analyse

      - name: Vulnerabilidades conhecidas nas dependências
        run: composer audit

      - name: Testes (PHPUnit)
        run: composer test

      - name: Pacote de produção
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && matrix.mysql == '8.4'
        run: php bin/build-release.php

      - name: Publicar o pacote (Artifacts)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && matrix.mysql == '8.4'
        uses: actions/upload-artifact@v4
        with:
          name: pacote-gnesting-${{ github.sha }}
          path: build/*.zip
          retention-days: 90
          if-no-files-found: error
